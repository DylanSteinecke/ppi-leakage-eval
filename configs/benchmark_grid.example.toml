# Paths are resolved from the directory where ppi-grid is invoked.
[grid]
pairs = "processed/biogrid_yeast_physical/pairs.csv"
fasta = "processed/biogrid_yeast_physical/proteins.fasta"
protein_metadata = "processed/biogrid_yeast_physical/protein_metadata.csv"
out_dir = "results"
run_name = "yeast_laptop_v1"
profile = "laptop"

# The yeast graph needs this density for feasible three-way C2 projection.
max_pairs = 50000
sampling_seed = 17
train_size = 0.80
val_size = 0.10
split_strategies = ["random", "c1", "c2", "c3"]
split_seeds = [0, 1, 2]
model_seeds = [100, 101]
# An explicit list overrides the profile exactly. Omit it to use profile defaults.
classifiers = [
  "degree_logistic",
  "always_positive",
  "always_negative",
  "sgd_logistic",
]
degree_bin_quantiles = [0.5, 0.9]
aggregate_results = true

# These are forwarded to each independent ppi-train process.
train_args = ["--no-metrics-plots"]

[plm]
enabled = false
# Omit embedding_cache_dir to use the automatic per-user cache. Set it only
# when a shared or explicitly managed cache location is required.
# Optional approved checkpoints; sizes above ESM2 8M require exhaustive mode.
# Example: ["esm2_150m", "esm2_650m"]
presets = []
adapter = "esm2"
model = "facebook/esm2_t6_8M_UR50D"
# Set an immutable Hugging Face commit when enabled = true.
revision = ""
